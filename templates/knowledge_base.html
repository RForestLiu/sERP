<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>品类知识库 — sERP</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-panel: #1e2433;
            --bg-card: #252d3f;
            --bg-input: #1a2030;
            --text-primary: #e0e0e0;
            --text-secondary: #8892b0;
            --text-muted: #5a6480;
            --accent: #64ffda;
            --accent-dim: #45b8a0;
            --danger: #ff6b6b;
            --warning: #ffd93d;
            --border: #2a3548;
            --border-active: #3a4560;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
            --tree-indent: 18px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            font-size: 13px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== Top Bar ===== */
        .topbar {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .topbar .title {
            font-size: 15px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.5px;
        }
        .topbar .nav-links { display: flex; gap: 4px; }
        .topbar .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            transition: all 0.15s;
        }
        .topbar .nav-links a:hover {
            background: rgba(100,255,218,0.08);
            color: var(--accent);
        }
        .topbar .store-selector {
            display: flex; align-items: center; gap: 8px;
        }
        .topbar .store-selector label { color: var(--text-secondary); font-size: 12px; }
        .topbar .store-selector select {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            min-width: 180px;
        }

        /* ===== Layout ===== */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .sidebar {
            width: 320px;
            min-width: 260px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
        }
        .sidebar-header {
            padding: 12px 14px;
            font-weight: 600;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .sidebar-toolbar {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            background: var(--bg-card);
            color: var(--text-primary);
            white-space: nowrap;
        }
        .btn:hover { border-color: var(--accent-dim); color: var(--accent); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-accent {
            background: var(--accent-dim);
            color: #000;
            border-color: var(--accent-dim);
            font-weight: 600;
        }
        .btn-accent:hover { background: var(--accent); border-color: var(--accent); }
        .tree-container {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }
        .tree-node {
            user-select: none;
        }
        .tree-row {
            display: flex;
            align-items: center;
            padding: 4px 8px;
            cursor: pointer;
            transition: background 0.1s;
            gap: 4px;
            font-size: 12px;
            border-left: 3px solid transparent;
        }
        .tree-row:hover { background: rgba(100,255,218,0.04); }
        .tree-row.active {
            background: rgba(100,255,218,0.08);
            border-left-color: var(--accent);
        }
        .tree-row .toggle {
            width: 16px;
            text-align: center;
            flex-shrink: 0;
            color: var(--text-muted);
            font-size: 10px;
        }
        .tree-row .toggle.expandable { cursor: pointer; color: var(--text-secondary); }
        .tree-row .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tree-row .name-ru {
            color: var(--text-primary);
        }
        .tree-row .name-cn {
            color: var(--accent-dim);
            font-size: 11px;
            margin-left: 4px;
        }
        .tree-row .id-tag {
            font-size: 10px;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .tree-row .leaf-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent-dim);
            flex-shrink: 0;
        }
        .tree-children {
            display: none;
        }
        .tree-children.open { display: block; }
        .tree-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-muted);
            gap: 8px;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .content-header {
            padding: 10px 16px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .content-header .cat-title {
            font-weight: 600;
            font-size: 13px;
        }
        .content-header .cat-path {
            font-size: 11px;
            color: var(--text-muted);
        }
        .content-header .search-box {
            margin-left: auto;
        }
        .content-header .search-box input {
            width: 200px;
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
        }
        .content-header .search-box input:focus { border-color: var(--accent-dim); }
        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }
        .content-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ===== Attribute Table ===== */
        .attr-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .attr-table th {
            text-align: left;
            padding: 8px 10px;
            background: var(--bg-panel);
            border-bottom: 2px solid var(--border);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 11px;
            position: sticky;
            top: 0;
        }
        .attr-table td {
            padding: 7px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .attr-table tr:hover td {
            background: rgba(100,255,218,0.03);
        }
        .attr-table .attr-name-ru {
            color: var(--text-primary);
            font-weight: 500;
        }
        .attr-table .attr-name-cn {
            color: var(--accent-dim);
            font-size: 11px;
            display: block;
            margin-top: 1px;
        }
        .attr-table .attr-id {
            color: var(--text-muted);
            font-size: 11px;
        }
        .attr-table .type-badge {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 3px;
            background: rgba(100,255,218,0.1);
            color: var(--accent-dim);
        }
        .attr-table .type-badge.String { background: rgba(100,255,218,0.1); color: var(--accent-dim); }
        .attr-table .type-badge.Integer { background: rgba(123,237,159,0.1); color: #7bed9f; }
        .attr-table .type-badge.Decimal { background: rgba(122,179,255,0.1); color: #7ab3ff; }
        .attr-table .type-badge.Boolean { background: rgba(255,165,2,0.1); color: var(--important); }
        .class-badge {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 3px;
            font-weight: 600;
        }
        .class-badge.critical { background: rgba(255,71,87,0.2); color: #ff4757; }
        .class-badge.important { background: rgba(255,165,2,0.2); color: #ffa502; }
        .class-badge.normal { background: rgba(123,237,159,0.2); color: #7bed9f; }
        .dict-values {
            font-size: 11px;
            color: var(--text-secondary);
            max-width: 240px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .stat-badge {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ===== Toast ===== */
        .toast-container {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 13px;
            animation: slideIn 0.2s;
            max-width: 360px;
            box-shadow: var(--shadow);
        }
        .toast.info { background: #1a3a5c; color: var(--accent); border: 1px solid var(--accent-dim); }
        .toast.error { background: #3a1a1a; color: var(--danger); border: 1px solid var(--danger); }
        .toast.success { background: #1a3a1a; color: var(--accent); border: 1px solid var(--accent-dim); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* ===== Spinner ===== */
        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-overlay {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            color: var(--text-muted);
            gap: 8px;
        }
    </style>
</head>
<body>

<!-- ===== Top Bar ===== -->
<div class="topbar">
    <div class="title">品类知识库</div>
    <div class="nav-links">
        <a href="/">采集 & 生图</a>
        <a href="/listing-workbench">上架工作台</a>
        <a href="/product-maintenance">产品维护</a>
        <a href="/ozon-listing">Ozon上架(旧)</a>
    </div>
    <div class="store-selector">
        <label>店铺:</label>
        <select id="store-select">
            <option value="">-- 加载中 --</option>
        </select>
    </div>
</div>

<!-- ===== Main Layout ===== -->
<div class="main-layout">
    <!-- ===== Sidebar: Category Tree ===== -->
    <div class="sidebar">
        <div class="sidebar-header">
            <span>&#127795;</span> Ozon 品类树
        </div>
        <div class="sidebar-toolbar">
            <button class="btn btn-accent btn-sm" onclick="refreshTree()">刷新品类树</button>
            <button class="btn btn-sm" onclick="expandAll()">全部展开</button>
            <button class="btn btn-sm" onclick="collapseAll()">全部折叠</button>
        </div>
        <div class="tree-container" id="tree-container">
            <div class="tree-loading"><span class="spinner"></span>加载品类树...</div>
        </div>
    </div>

    <!-- ===== Content: Attribute Table ===== -->
    <div class="content">
        <div class="content-header" id="content-header">
            <span class="cat-title" id="cat-title">属性列表</span>
            <span class="cat-path" id="cat-path"></span>
            <span class="stat-badge" id="attr-count-stat"></span>
            <div class="search-box">
                <input type="text" id="attr-search" placeholder="搜索属性名..." autocomplete="off">
            </div>
        </div>
        <div class="content-body" id="content-body">
            <div class="content-empty">选择左侧品类查看属性</div>
        </div>
    </div>
</div>

<!-- ===== Toast Container ===== -->
<div class="toast-container" id="toast-container"></div>

<script>
// ============ State ============
const state = {
    storeId: '',
    tree: null,
    selectedCategoryId: null,
    selectedCategory: null,
    attributes: [],
    attrSearchFilter: '',
};

// ============ Helpers ============
function toast(msg, type='info') {
    const c = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    c.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 200); }, 3500);
}

async function api(url, method='GET', body=null) {
    const opts = { method, headers: {'Content-Type': 'application/json'} };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(url, opts);
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || `HTTP ${res.status}`);
    }
    return res.json();
}

function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
}

// ============ Init ============
async function init() {
    // Load stores
    try {
        const stores = await api('/api/stores');
        const sel = document.getElementById('store-select');
        sel.innerHTML = '<option value="">-- 选择店铺 --</option>';
        stores.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = `${s.name || s.id} (${s.platform || 'Ozon'})`;
            sel.appendChild(opt);
        });
        const ozonStore = stores.find(s => (s.platform||'').toLowerCase().includes('ozon') || s.id.includes('ozon'));
        if (ozonStore) {
            sel.value = ozonStore.id;
            state.storeId = ozonStore.id;
            await loadTree();
        }
    } catch(e) {
        toast('加载店铺失败: ' + e.message, 'error');
    }

    document.getElementById('store-select').addEventListener('change', onStoreChange);
    document.getElementById('attr-search').addEventListener('input', debounce(onAttrSearch, 200));
}

function debounce(fn, ms) {
    let timer;
    return function(...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), ms);
    };
}

async function onStoreChange(e) {
    state.storeId = e.target.value;
    state.selectedCategoryId = null;
    state.attributes = [];
    if (state.storeId) {
        await loadTree();
    }
    renderContent();
}

// ============ Category Tree ============
async function loadTree() {
    if (!state.storeId) return;
    const container = document.getElementById('tree-container');
    container.innerHTML = '<div class="tree-loading"><span class="spinner"></span>加载品类树...</div>';
    try {
        const result = await api(`/api/ozon/${state.storeId}/category-tree`);
        state.tree = result.category_tree || result.data || [];
        renderTree();
    } catch(e) {
        container.innerHTML = `<div class="tree-loading">加载失败: ${escHtml(e.message)}</div>`;
        toast('加载品类树失败: ' + e.message, 'error');
    }
}

async function refreshTree() {
    if (!state.storeId) return;
    try {
        await api(`/api/ozon/${state.storeId}/refresh-categories`, 'POST');
        toast('品类树刷新已启动', 'info');
        // Poll status
        setTimeout(async () => {
            await loadTree();
            toast('品类树已更新', 'success');
        }, 3000);
    } catch(e) {
        toast('刷新失败: ' + e.message, 'error');
    }
}

function renderTree() {
    const container = document.getElementById('tree-container');
    if (!state.tree || !state.tree.length) {
        container.innerHTML = '<div class="tree-loading">品类树为空</div>';
        return;
    }
    container.innerHTML = '';
    state.tree.forEach((node, i) => {
        renderTreeNode(container, node, 0, `root-${i}`);
    });
}

function renderTreeNode(parent, node, depth, path) {
    const wrapper = document.createElement('div');
    wrapper.className = 'tree-node';

    const row = document.createElement('div');
    row.className = 'tree-row';
    row.dataset.path = path;
    row.dataset.nodeId = node.description_category_id || node.type_id || node.id || '';
    row.dataset.depth = depth;
    row.style.paddingLeft = `${8 + depth * 20}px`;

    // Toggle icon
    const hasChildren = node.children && node.children.length > 0;
    const isLeaf = !hasChildren && !(node.disabled);
    const toggle = document.createElement('span');
    toggle.className = 'toggle';
    if (hasChildren) {
        toggle.className += ' expandable';
        toggle.textContent = '▶';
        toggle.onclick = (e) => {
            e.stopPropagation();
            toggleNode(wrapper, toggle);
        };
    } else {
        toggle.textContent = isLeaf ? '' : '';
    }
    row.appendChild(toggle);

    // Name
    const nameEl = document.createElement('span');
    nameEl.className = 'name';
    let nameDisplay = node.type_name || node.category_name || node.name || `ID:${node.id}`;
    nameEl.innerHTML = `<span class="name-ru">${escHtml(nameDisplay)}</span>`;

    // Chinese translation if available
    if (node.name_cn) {
        nameEl.innerHTML += `<span class="name-cn">${escHtml(node.name_cn)}</span>`;
    }
    row.appendChild(nameEl);

    // ID tag
    const idTag = document.createElement('span');
    idTag.className = 'id-tag';
    idTag.textContent = `#${node.description_category_id || node.type_id || node.id || ''}`;
    row.appendChild(idTag);

    // Leaf indicator
    if (isLeaf) {
        const leafDot = document.createElement('span');
        leafDot.className = 'leaf-dot';
        row.appendChild(leafDot);
    }

    row.onclick = () => {
        selectCategory(
            node.description_category_id || node.type_id || node.id,
            node
        );
    };

    wrapper.appendChild(row);

    // Children
    if (hasChildren) {
        const childrenDiv = document.createElement('div');
        childrenDiv.className = 'tree-children';
        node.children.forEach((child, i) => {
            renderTreeNode(childrenDiv, child, depth + 1, `${path}-${i}`);
        });
        wrapper.appendChild(childrenDiv);
    }

    parent.appendChild(wrapper);
}

function toggleNode(wrapper, toggle) {
    const children = wrapper.querySelector('.tree-children');
    if (!children) return;
    if (children.classList.contains('open')) {
        children.classList.remove('open');
        toggle.textContent = '▶';
    } else {
        children.classList.add('open');
        toggle.textContent = '▼';
    }
}

function expandAll() {
    document.querySelectorAll('.tree-children').forEach(el => el.classList.add('open'));
    document.querySelectorAll('.toggle.expandable').forEach(el => el.textContent = '▼');
}

function collapseAll() {
    document.querySelectorAll('.tree-children').forEach(el => el.classList.remove('open'));
    document.querySelectorAll('.toggle.expandable').forEach(el => el.textContent = '▶');
}

// ============ Category Selection & Attributes ============
async function selectCategory(categoryId, node) {
    state.selectedCategoryId = categoryId;
    state.selectedCategory = node;
    state.attributes = [];

    // Highlight
    document.querySelectorAll('.tree-row').forEach(r => r.classList.remove('active'));
    const row = document.querySelector(`.tree-row[data-node-id="${categoryId}"]`);
    if (row) row.classList.add('active');

    // Update header
    const name = node.type_name || node.category_name || node.name || '';
    const nameCn = node.name_cn || '';
    document.getElementById('cat-title').textContent = nameCn ? `${name}（${nameCn}）` : name;
    document.getElementById('cat-path').textContent = `ID: ${categoryId}`;
    document.getElementById('attr-count-stat').textContent = '加载中...';

    // Expand path to this node
    let parent = row ? row.closest('.tree-node') : null;
    while (parent) {
        const children = parent.querySelector('.tree-children');
        if (children) children.classList.add('open');
        const toggle = parent.querySelector('.toggle.expandable');
        if (toggle) toggle.textContent = '▼';
        const grandParent = parent.parentElement ? parent.parentElement.closest('.tree-node') : null;
        parent = grandParent;
    }

    // Load attributes
    await loadAttributes(categoryId);
    renderContent();
}

async function loadAttributes(categoryId) {
    if (!state.storeId || !categoryId) return;
    document.getElementById('content-body').innerHTML =
        '<div class="loading-overlay"><span class="spinner"></span>加载属性...</div>';

    try {
        const result = await api(`/api/ozon/${state.storeId}/category-attributes`, 'POST', {
            description_category_id: parseInt(categoryId)
        });
        state.attributes = result.attributes || result.result || [];
        document.getElementById('attr-count-stat').textContent = `${state.attributes.length} 个属性`;
        // Also store dictionary
        if (result.dictionaries) {
            state._dictionaries = result.dictionaries;
        }
    } catch(e) {
        state.attributes = [];
        document.getElementById('attr-count-stat').textContent = '加载失败';
        toast('加载属性失败: ' + e.message, 'error');
    }
    renderContent();
}

function onAttrSearch() {
    state.attrSearchFilter = (document.getElementById('attr-search').value || '').toLowerCase();
    renderContent();
}

// ============ Content Rendering ============
function renderContent() {
    const body = document.getElementById('content-body');

    if (!state.selectedCategoryId) {
        body.innerHTML = '<div class="content-empty">选择左侧品类查看属性</div>';
        document.getElementById('cat-title').textContent = '属性列表';
        document.getElementById('cat-path').textContent = '';
        document.getElementById('attr-count-stat').textContent = '';
        return;
    }

    if (!state.attributes.length) {
        body.innerHTML = '<div class="content-empty">该品类无可用属性</div>';
        document.getElementById('attr-count-stat').textContent = '0 个属性';
        return;
    }

    let attrs = state.attributes;
    if (state.attrSearchFilter) {
        attrs = attrs.filter(a =>
            (a.complex_name || a.name || '').toLowerCase().includes(state.attrSearchFilter) ||
            (a.name_cn || '').toLowerCase().includes(state.attrSearchFilter) ||
            String(a.attribute_id || '').includes(state.attrSearchFilter)
        );
    }

    // Classify
    const critical = (a) => a.is_required || a.complex_is_required;
    const important = (a) => !critical(a) && (
        (a.complex_name || a.name || '').toLowerCase().includes('name') ||
        (a.complex_name || a.name || '').toLowerCase().includes('название') ||
        (a.complex_name || a.name || '').toLowerCase().includes('описание') ||
        (a.complex_name || a.name || '').toLowerCase().includes('description') ||
        (a.complex_name || a.name || '').toLowerCase().includes('brand') ||
        (a.complex_name || a.name || '').toLowerCase().includes('бренд')
    );

    let html = `<table class="attr-table">
        <thead>
            <tr>
                <th style="width:40px">#</th>
                <th style="width:60px">ID</th>
                <th>属性名</th>
                <th style="width:80px">类型</th>
                <th style="width:70px">分类</th>
                <th style="width:80px">必需</th>
                <th>字典值</th>
            </tr>
        </thead>
        <tbody>`;

    attrs.forEach((attr, i) => {
        const attrId = attr.attribute_id || attr.id || '';
        const name = attr.complex_name || attr.name || `Attr#${attrId}`;
        const nameCn = attr.name_cn || '';
        const type = attr.complex_type || attr.type || 'String';
        const required = attr.is_required || attr.complex_is_required ? '是' : '否';
        const cls = critical(attr) ? 'critical' : important(attr) ? 'important' : 'normal';
        const clsLabel = cls === 'critical' ? '关键' : cls === 'important' ? '重要' : '常规';

        // Dictionary values
        let dictHtml = '';
        if (attr.dictionary && attr.dictionary.length) {
            const vals = attr.dictionary.slice(0, 5).map(d =>
                typeof d === 'object' ? (d.value || d.name || '') : d
            ).join(', ');
            dictHtml = `<span class="dict-values" title="${escHtml(vals)}">${escHtml(vals)}${attr.dictionary.length > 5 ? '...' : ''}</span>`;
        }
        if (attr.complex_dictionary && attr.complex_dictionary.length) {
            const vals = attr.complex_dictionary.slice(0, 5).map(d =>
                typeof d === 'object' ? (d.value || d.name || '') : d
            ).join(', ');
            dictHtml += dictHtml ? '<br>' : '';
            dictHtml += `<span class="dict-values" title="${escHtml(vals)}">${escHtml(vals)}${attr.complex_dictionary.length > 5 ? '...' : ''}</span>`;
        }

        html += `<tr>
            <td>${i + 1}</td>
            <td><span class="attr-id">${attrId}</span></td>
            <td>
                <span class="attr-name-ru">${escHtml(name)}</span>
                ${nameCn ? `<span class="attr-name-cn">${escHtml(nameCn)}</span>` : ''}
            </td>
            <td><span class="type-badge ${type}">${type}</span></td>
            <td><span class="class-badge ${cls}">${clsLabel}</span></td>
            <td>${required}</td>
            <td>${dictHtml || '<span style="color:var(--text-muted);font-size:11px;">无</span>'}</td>
        </tr>`;
    });

    html += '</tbody></table>';

    if (!attrs.length && state.attrSearchFilter) {
        html += '<div style="text-align:center;padding:20px;color:var(--text-muted)">无匹配属性</div>';
    }

    body.innerHTML = html;
}

// ============ Init ============
init();
</script>
</body>
</html>
