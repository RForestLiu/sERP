<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>品类知识库 — sERP</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-panel: #1e2433;
            --bg-card: #252d3f;
            --bg-input: #1a2030;
            --text-primary: #e0e0e0;
            --text-secondary: #8892b0;
            --text-muted: #5a6480;
            --accent: #64ffda;
            --accent-dim: #45b8a0;
            --critical: #ff4757;
            --important: #ffa502;
            --normal: #7bed9f;
            --border: #2a3548;
            --border-active: #3a4560;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            font-size: 13px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== Top Bar ===== */
        .topbar {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .topbar .title {
            font-size: 15px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .topbar .nav-links { display: flex; gap: 4px; }
        .topbar .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            transition: all 0.15s;
        }
        .topbar .nav-links a:hover {
            background: rgba(100,255,218,0.08);
            color: var(--accent);
        }

        /* ===== Layout ===== */
        .main-layout {
            display: flex;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== Toolbar ===== */
        .toolbar {
            padding: 10px 20px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .toolbar .label {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .toolbar .search-box input {
            width: 260px;
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
        }
        .toolbar .search-box input:focus { border-color: var(--accent-dim); }
        .filter-chips {
            display: flex;
            gap: 6px;
        }
        .filter-chip {
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.15s;
            color: var(--text-secondary);
            user-select: none;
        }
        .filter-chip:hover { border-color: var(--accent-dim); color: var(--accent); }
        .filter-chip.active { background: rgba(100,255,218,0.12); border-color: var(--accent-dim); color: var(--accent); }
        .filter-chip.all { border-style: dashed; }
        .count-badge {
            font-size: 11px;
            color: var(--text-muted);
            margin-left: auto;
        }

        /* ===== Content ===== */
        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }
        .content-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ===== Attribute Table ===== */
        .attr-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .attr-table thead { position: sticky; top: 0; z-index: 2; }
        .attr-table th {
            text-align: left;
            padding: 8px 10px;
            background: var(--bg-panel);
            border-bottom: 2px solid var(--border);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 11px;
            white-space: nowrap;
        }
        .attr-table td {
            padding: 7px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            vertical-align: top;
        }
        .attr-table tbody tr:hover td {
            background: rgba(100,255,218,0.03);
        }
        .attr-table .attr-name-ru {
            color: var(--text-primary);
            font-weight: 500;
        }
        .attr-table .attr-name-cn {
            color: var(--accent-dim);
            font-size: 11px;
            display: block;
            margin-top: 2px;
        }
        .attr-table .attr-id {
            color: var(--text-muted);
            font-size: 11px;
        }
        .attr-table .type-badge {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 3px;
            display: inline-block;
        }
        .attr-table .type-badge.String { background: rgba(100,255,218,0.1); color: var(--accent-dim); }
        .attr-table .type-badge.Integer { background: rgba(123,237,159,0.1); color: #7bed9f; }
        .attr-table .type-badge.Decimal { background: rgba(122,179,255,0.1); color: #7ab3ff; }
        .attr-table .type-badge.Boolean { background: rgba(255,165,2,0.1); color: var(--important); }
        .attr-table .type-badge.URL { background: rgba(200,150,255,0.1); color: #c896ff; }
        .class-badge {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 3px;
            font-weight: 600;
            display: inline-block;
        }
        .class-badge.critical { background: rgba(255,71,87,0.2); color: var(--critical); }
        .class-badge.important { background: rgba(255,165,2,0.2); color: var(--important); }
        .class-badge.normal { background: rgba(123,237,159,0.2); color: var(--normal); }
        .required-mark { color: var(--critical); font-weight: 700; font-size: 13px; }
        .strategy-badge {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 3px;
            background: rgba(100,255,218,0.06);
            color: var(--text-secondary);
            display: inline-block;
            white-space: nowrap;
        }
        .dict-values {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .dict-toggle {
            font-size: 10px;
            color: var(--accent-dim);
            cursor: pointer;
            user-select: none;
            background: none;
            border: none;
            font-family: inherit;
            padding: 0;
        }
        .dict-toggle:hover { color: var(--accent); }
        .dict-list {
            display: none;
            margin-top: 4px;
            padding-left: 6px;
            border-left: 1px solid var(--border);
        }
        .dict-list.open { display: block; }
        .dict-item {
            font-size: 10px;
            padding: 1px 0;
            color: var(--text-muted);
        }
        .dict-item .dict-id { color: var(--text-muted); opacity: 0.6; margin-right: 4px; }
        .desc-tooltip {
            max-width: 320px;
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.5;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            cursor: default;
        }

        /* ===== Toast ===== */
        .toast-container {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 13px;
            animation: slideIn 0.2s;
            max-width: 360px;
            box-shadow: var(--shadow);
        }
        .toast.info { background: #1a3a5c; color: var(--accent); border: 1px solid var(--accent-dim); }
        .toast.error { background: #3a1a1a; color: #ff6b6b; border: 1px solid #ff6b6b; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* ===== Spinner ===== */
        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-overlay {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--text-muted);
            gap: 8px;
        }
    </style>
</head>
<body>

<!-- ===== Top Bar ===== -->
<div class="topbar">
    <div class="title">
        品类知识库
        <span style="font-size:11px;color:var(--text-muted);font-weight:400;">Ozon / 钱包</span>
    </div>
    <div class="nav-links">
        <a href="/">采集 & 生图</a>
        <a href="/listing-workbench">上架工作台</a>
        <a href="/product-maintenance">产品维护</a>
    </div>
</div>

<!-- ===== Main Layout ===== -->
<div class="main-layout">
    <!-- ===== Toolbar ===== -->
    <div class="toolbar">
        <span class="label">分类筛选：</span>
        <div class="filter-chips" id="filter-chips">
            <span class="filter-chip all active" data-classification="">全部</span>
            <span class="filter-chip" data-classification="critical">关键</span>
            <span class="filter-chip" data-classification="important">重要</span>
            <span class="filter-chip" data-classification="normal">常规</span>
        </div>
        <div class="search-box">
            <input type="text" id="attr-search" placeholder="搜索属性名（俄文 / 中文）..." autocomplete="off">
        </div>
        <span class="count-badge" id="count-badge"></span>
    </div>

    <!-- ===== Content ===== -->
    <div class="content-body" id="content-body">
        <div class="loading-overlay"><span class="spinner"></span>加载知识库...</div>
    </div>
</div>

<!-- ===== Toast Container ===== -->
<div class="toast-container" id="toast-container"></div>

<script>
// ============ State ============
const state = {
    attributes: [],
    classificationFilter: '',
    searchFilter: '',
};

// ============ Helpers ============
function toast(msg, type) {
    type = type || 'info';
    const c = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    c.appendChild(el);
    setTimeout(function() { el.style.opacity = '0'; setTimeout(function() { el.remove(); }, 200); }, 3500);
}

async function api(url) {
    const res = await fetch(url);
    if (!res.ok) {
        const err = await res.json().catch(function() { return {}; });
        throw new Error(err.error || ('HTTP ' + res.status));
    }
    return res.json();
}

function escHtml(s) {
    if (s == null) return '';
    const d = document.createElement('div');
    d.textContent = String(s);
    return d.innerHTML;
}

function debounce(fn, ms) {
    var timer;
    return function() {
        var ctx = this, args = arguments;
        clearTimeout(timer);
        timer = setTimeout(function() { fn.apply(ctx, args); }, ms);
    };
}

// ============ Init ============
async function init() {
    // Bind classification filter
    document.getElementById('filter-chips').addEventListener('click', function(e) {
        var chip = e.target.closest('.filter-chip');
        if (!chip) return;
        document.querySelectorAll('#filter-chips .filter-chip').forEach(function(c) { c.classList.remove('active'); });
        chip.classList.add('active');
        state.classificationFilter = chip.dataset.classification || '';
        renderTable();
    });

    // Bind search
    document.getElementById('attr-search').addEventListener('input', debounce(function() {
        state.searchFilter = (document.getElementById('attr-search').value || '').toLowerCase();
        renderTable();
    }, 200));

    // Load data
    await loadAttributes();
}

async function loadAttributes() {
    try {
        var data = await api('/api/knowledge/ozon/wallet_attributes');
        state.attributes = Array.isArray(data) ? data : [];
        if (!state.attributes.length) {
            showEmpty('知识库无数据');
        }
        renderTable();
    } catch(e) {
        showEmpty('加载知识库失败: ' + e.message);
        toast('加载失败: ' + e.message, 'error');
    }
}

function showEmpty(msg) {
    document.getElementById('content-body').innerHTML = '<div class="content-empty">' + escHtml(msg) + '</div>';
    document.getElementById('count-badge').textContent = '';
}

// ============ Render ============
function renderTable() {
    var attrs = state.attributes;

    // Filter by classification
    if (state.classificationFilter) {
        attrs = attrs.filter(function(a) {
            return (a.classification || '') === state.classificationFilter;
        });
    }

    // Filter by search
    if (state.searchFilter) {
        var s = state.searchFilter;
        attrs = attrs.filter(function(a) {
            return (a.name || '').toLowerCase().indexOf(s) !== -1 ||
                   (a.name_cn || '').toLowerCase().indexOf(s) !== -1 ||
                   String(a.id || '').indexOf(s) !== -1;
        });
    }

    // Update count
    document.getElementById('count-badge').textContent = '共 ' + attrs.length + ' / ' + state.attributes.length + ' 个属性';

    var body = document.getElementById('content-body');

    if (!attrs.length) {
        body.innerHTML = '<div class="content-empty">' +
            (state.searchFilter ? '无匹配属性，请调整搜索条件' : '该分类下无属性') +
            '</div>';
        return;
    }

    // Classification label mapping
    var clsLabel = { critical: '关键', important: '重要', normal: '常规' };

    var html = '<table class="attr-table">';
    html += '<thead><tr>' +
        '<th style="width:50px">ID</th>' +
        '<th>属性名</th>' +
        '<th style="width:70px">类型</th>' +
        '<th style="width:50px">必需</th>' +
        '<th style="width:70px">分类</th>' +
        '<th style="width:80px">填充策略</th>' +
        '<th>字典值</th>' +
        '</tr></thead>';
    html += '<tbody>';

    attrs.forEach(function(attr) {
        var cls = attr.classification || 'normal';
        var required = attr.is_required ? '<span class="required-mark">&#10003;</span>' : '<span style="color:var(--text-muted)">—</span>';
        var type = attr.type || 'String';

        // Fill strategy
        var strategy = attr.fill_strategy || '—';
        var strategyDetail = attr.strategy_detail || '';

        // Dictionary values
        var dictHtml = '';
        var dv = attr.dictionary_values;
        if (dv && dv.length) {
            var firstFew = dv.slice(0, 4).map(function(d) {
                return escHtml(d.value) + ' <span class="dict-id">#' + d.id + '</span>';
            }).join('，');
            var remaining = dv.length > 4 ? ' 等 ' + dv.length + ' 项' : '';
            dictHtml = '<span class="dict-values">' + firstFew + remaining + '</span>';
            if (dv.length > 4) {
                var fullList = dv.map(function(d) {
                    return '<div class="dict-item">' + escHtml(d.value) + ' <span class="dict-id">#' + d.id + '</span></div>';
                }).join('');
                dictHtml += '<br><button class="dict-toggle" onclick="toggleDict(this)">展开全部 (' + dv.length + ')</button>' +
                    '<div class="dict-list">' + fullList + '</div>';
            }
        } else {
            dictHtml = '<span style="color:var(--text-muted);font-size:11px;">—</span>';
        }

        html += '<tr>' +
            '<td><span class="attr-id">' + attr.id + '</span></td>' +
            '<td>' +
                '<span class="attr-name-ru">' + escHtml(attr.name) + '</span>' +
                (attr.name_cn ? '<span class="attr-name-cn">' + escHtml(attr.name_cn) + '</span>' : '') +
            '</td>' +
            '<td><span class="type-badge ' + type + '">' + type + '</span></td>' +
            '<td>' + required + '</td>' +
            '<td><span class="class-badge ' + cls + '">' + (clsLabel[cls] || cls) + '</span></td>' +
            '<td><span class="strategy-badge" title="' + escHtml(strategyDetail) + '">' + escHtml(strategy) + '</span></td>' +
            '<td>' + dictHtml + '</td>' +
            '</tr>';
    });

    html += '</tbody></table>';
    body.innerHTML = html;
}

function toggleDict(btn) {
    var list = btn.nextElementSibling;
    if (!list) return;
    if (list.classList.contains('open')) {
        list.classList.remove('open');
        btn.textContent = '展开全部 (' + list.querySelectorAll('.dict-item').length + ')';
    } else {
        list.classList.add('open');
        btn.textContent = '收起';
    }
}

// ============ Start ============
init();
</script>
</body>
</html>
