<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品维护 — sERP</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-panel: #1e2433;
            --bg-card: #252d3f;
            --bg-input: #1a2030;
            --text-primary: #e0e0e0;
            --text-secondary: #8892b0;
            --text-muted: #5a6480;
            --accent: #64ffda;
            --accent-dim: #45b8a0;
            --danger: #ff6b6b;
            --warning: #ffd93d;
            --critical: #ff4757;
            --important: #ffa502;
            --normal: #7bed9f;
            --border: #2a3548;
            --border-active: #3a4560;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            font-size: 13px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== Top Bar ===== */
        .topbar {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .topbar .title {
            font-size: 15px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.5px;
        }
        .topbar .nav-links { display: flex; gap: 4px; }
        .topbar .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            transition: all 0.15s;
        }
        .topbar .nav-links a:hover {
            background: rgba(100,255,218,0.08);
            color: var(--accent);
        }

        /* ===== Layout ===== */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            min-width: 240px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
        }
        .sidebar-header {
            padding: 12px 14px;
            font-weight: 600;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .sidebar-search {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-search input {
            width: 100%;
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 7px 10px;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
        }
        .sidebar-search input:focus { border-color: var(--accent-dim); }
        .platform-filter {
            padding: 6px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .platform-filter .chip {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.15s;
            color: var(--text-secondary);
        }
        .platform-filter .chip:hover { border-color: var(--accent-dim); color: var(--accent); }
        .platform-filter .chip.active { background: rgba(100,255,218,0.15); border-color: var(--accent-dim); color: var(--accent); }
        .product-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 0;
        }
        .product-item {
            padding: 10px 14px;
            cursor: pointer;
            transition: background 0.15s;
            border-left: 3px solid transparent;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .product-item:hover { background: rgba(100,255,218,0.04); }
        .product-item.active {
            background: rgba(100,255,218,0.08);
            border-left-color: var(--accent);
        }
        .product-item .skc {
            font-weight: 600;
            font-size: 12px;
            color: var(--accent);
            min-width: 100px;
        }
        .product-item .title-text {
            font-size: 12px;
            color: var(--text-secondary);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .product-item .store-dots {
            display: flex;
            gap: 3px;
            flex-shrink: 0;
        }
        .store-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
        }
        .store-dot.listed { background: var(--accent); }
        .store-dot.pending { background: var(--warning); }
        .store-dot.none { background: var(--text-muted); }

        .detail-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .detail-empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ===== Detail Header ===== */
        .detail-header {
            padding: 12px 20px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .detail-header .product-skc {
            font-weight: 700;
            font-size: 14px;
            color: var(--accent);
        }
        .detail-header .product-title {
            font-size: 13px;
            color: var(--text-secondary);
            flex: 1;
        }
        .detail-header .category-badge {
            font-size: 11px;
            background: rgba(100,255,218,0.1);
            color: var(--accent-dim);
            padding: 2px 8px;
            border-radius: 3px;
        }
        .detail-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        /* ===== Detail Sections ===== */
        .detail-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .detail-section-header {
            padding: 10px 14px;
            font-weight: 600;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }
        .detail-section-header:hover { background: rgba(100,255,218,0.03); }
        .detail-section-body {
            padding: 12px 14px;
        }
        .detail-section-body.collapsed { display: none; }

        /* ===== Field Rows ===== */
        .field-row {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            gap: 10px;
        }
        .field-row:last-child { border-bottom: none; }
        .field-label {
            width: 110px;
            min-width: 110px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .field-value {
            flex: 1;
            font-size: 12px;
            color: var(--text-primary);
        }
        .classification-badge {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 3px;
            font-weight: 600;
        }
        .classification-badge.critical { background: rgba(255,71,87,0.2); color: var(--critical); }
        .classification-badge.important { background: rgba(255,165,2,0.2); color: var(--important); }
        .classification-badge.normal { background: rgba(123,237,159,0.2); color: var(--normal); }

        .field-row.editable .field-value {
            cursor: pointer;
            border-bottom: 1px dashed var(--border);
            padding: 2px 4px;
            border-radius: 2px;
        }
        .field-row.editable .field-value:hover {
            background: rgba(100,255,218,0.05);
            border-bottom-color: var(--accent-dim);
        }
        .field-row.editing .field-value {
            display: none;
        }
        .field-row .edit-input {
            display: none;
            flex: 1;
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--accent-dim);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
            font-family: inherit;
        }
        .field-row.editing .edit-input { display: block; }

        /* ===== Store Status ===== */
        .store-status-row {
            display: flex;
            align-items: center;
            padding: 6px 0;
            gap: 10px;
            font-size: 12px;
        }
        .store-name {
            width: 120px;
            color: var(--text-secondary);
        }
        .store-listing-link {
            margin-left: auto;
            text-decoration: none;
        }
        .store-status {
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
        }
        .store-status.s-已上架 { background: rgba(100,255,218,0.2); color: var(--accent); }
        .store-status.s-审核中 { background: rgba(255,217,61,0.15); color: var(--warning); }
        .store-status.s-审核拒绝 { background: rgba(255,71,87,0.2); color: var(--danger); }
        .store-status.s-未上架 { background: rgba(90,100,128,0.2); color: var(--text-muted); }
        .store-status.s-已下架 { background: rgba(90,100,128,0.2); color: var(--text-muted); }

        /* ===== Approvals Panel ===== */
        .approval-item {
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 8px;
            background: var(--bg-panel);
        }
        .approval-item .ai-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .approval-item .ai-field {
            font-weight: 600;
            color: var(--critical);
            font-size: 12px;
        }
        .approval-item .ai-date {
            font-size: 11px;
            color: var(--text-muted);
        }
        .approval-item .ai-values {
            font-size: 12px;
            margin-bottom: 6px;
        }
        .approval-item .ai-reason {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-style: italic;
        }
        .approval-item .ai-actions {
            display: flex;
            gap: 8px;
        }
        .btn {
            padding: 5px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            background: var(--bg-card);
            color: var(--text-primary);
            white-space: nowrap;
        }
        .btn:hover { border-color: var(--accent-dim); color: var(--accent); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-success { color: var(--accent); border-color: var(--accent-dim); }
        .btn-success:hover { background: var(--accent-dim); color: #000; }
        .btn-danger { color: var(--danger); border-color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #fff; }
        .btn-sm { padding: 3px 8px; font-size: 11px; }

        /* ===== Image Thumbs ===== */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 6px;
        }
        .image-thumb {
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 4px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .image-thumb:hover { border-color: var(--accent-dim); }

        /* ===== Toast ===== */
        .toast-container {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 13px;
            animation: slideIn 0.2s;
            max-width: 360px;
            box-shadow: var(--shadow);
        }
        .toast.info { background: #1a3a5c; color: var(--accent); border: 1px solid var(--accent-dim); }
        .toast.error { background: #3a1a1a; color: var(--danger); border: 1px solid var(--danger); }
        .toast.success { background: #1a3a1a; color: var(--accent); border: 1px solid var(--accent-dim); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* ===== Modal ===== */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 480px;
            max-width: 90vw;
            box-shadow: var(--shadow);
        }
        .modal-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-body {
            padding: 16px;
            max-height: 60vh;
            overflow-y: auto;
        }
        .modal-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .modal textarea {
            width: 100%;
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            outline: none;
        }
        .modal textarea:focus { border-color: var(--accent-dim); }
        .modal .field-info {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        /* ===== Spinner ===== */
        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-overlay {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            color: var(--text-muted);
            gap: 8px;
        }

        /* ===== Approvals sidebar ===== */
        .approvals-panel {
            width: 320px;
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
            overflow: hidden;
        }
        .approvals-panel .panel-header {
            padding: 12px 14px;
            font-weight: 600;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .approvals-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .approvals-empty {
            text-align: center;
            color: var(--text-muted);
            padding: 30px 10px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<!-- ===== Top Bar ===== -->
<div class="topbar">
    <div class="title">产品维护</div>
    <div class="nav-links">
        <a href="/">采集 & 生图</a>
        <a href="/ozon-product/add">上架工作台</a>
        <a href="/knowledge-base">知识库</a>
        <a href="/ozon-listing">Ozon上架(旧)</a>
    </div>
</div>

<!-- ===== Main Layout ===== -->
<div class="main-layout">
    <!-- ===== Sidebar: Product List ===== -->
    <div class="sidebar">
        <div class="sidebar-header">
            <span>&#128203;</span> 产品列表
            <span style="margin-left:auto;font-size:11px;color:var(--text-muted)" id="product-count"></span>
        </div>
        <div class="sidebar-search">
            <input type="text" id="sidebar-search" placeholder="搜索 SKC / 标题..." autocomplete="off">
        </div>
        <div class="platform-filter" id="platform-filter">
            <span class="chip active" data-platform="">全部</span>
            <span class="chip" data-platform="Amazon">Amazon</span>
            <span class="chip" data-platform="Wildberries">Wildberries</span>
            <span class="chip" data-platform="Ozon">Ozon</span>
        </div>
        <div class="product-list" id="product-list">
            <div class="loading-overlay"><span class="spinner"></span>加载中...</div>
        </div>
    </div>

    <!-- ===== Detail Panel ===== -->
    <div class="detail-panel" id="detail-panel">
        <div class="detail-empty" id="detail-empty">
            选择左侧产品查看详情
        </div>
    </div>

    <!-- ===== Approvals Panel ===== -->
    <div class="approvals-panel">
        <div class="panel-header">
            &#128220; 待审批变更
            <span style="margin-left:auto;font-size:11px;color:var(--text-muted)" id="approvals-count"></span>
        </div>
        <div class="approvals-list" id="approvals-list">
            <div class="approvals-empty">暂无待审批变更</div>
        </div>
    </div>
</div>

<!-- ===== Propose Change Modal ===== -->
<div class="modal-overlay" id="propose-modal" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            提出变更申请
            <button class="btn btn-sm" onclick="closeProposeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="field-info" id="propose-field-info"></div>
            <label style="font-size:12px;color:var(--text-secondary)">建议值：</label>
            <textarea id="propose-value" placeholder="输入建议的新值..."></textarea>
            <label style="font-size:12px;color:var(--text-secondary);margin-top:8px;display:block">变更理由：</label>
            <textarea id="propose-reason" placeholder="简要说明变更原因..."></textarea>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="closeProposeModal()">取消</button>
            <button class="btn btn-success" id="propose-submit-btn">提交申请</button>
        </div>
    </div>
</div>

<!-- ===== Toast Container ===== -->
<div class="toast-container" id="toast-container"></div>

<script>
// ============ State ============
const state = {
    products: [],
    selectedSku: null,
    selectedProduct: null,
    platformFilter: '',
    editField: null,
    proposeField: null,
    pendingApprovals: [],
};

// ============ Helpers ============
function toast(msg, type='info') {
    const c = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    c.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 200); }, 3500);
}

async function api(url, method='GET', body=null) {
    const opts = { method, headers: {'Content-Type': 'application/json'} };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(url, opts);
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || `HTTP ${res.status}`);
    }
    return res.json();
}

function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
}

function listingUrl(storeId) {
    const skc = state.selectedProduct ? state.selectedProduct.skc : state.selectedSku;
    return `/ozon-product/add?skc=${encodeURIComponent(skc || '')}&store_id=${encodeURIComponent(storeId || '')}`;
}

function listingActionLabel(status) {
    if (status === '已上架') return '编辑';
    if (status === '待发布') return '继续上架';
    if (status === '审核拒绝') return '修复';
    if (status === '审核中') return '查看';
    return '上架';
}

// ============ Init ============
async function init() {
    await loadProducts();
    await loadPendingApprovals();
    bindEvents();
}

async function loadProducts() {
    try {
        const data = await api('/api/products');
        state.products = (data.products || []).filter(p => p.skc);
        state._stores = data.stores || [];
        document.getElementById('product-count').textContent = `${state.products.length} 个`;
        renderProductList();
    } catch(e) {
        toast('加载产品失败: ' + e.message, 'error');
    }
}

async function loadPendingApprovals() {
    try {
        const data = await api('/api/products/pending-approvals' +
            (state.selectedSku ? `?skc=${state.selectedSku}` : ''));
        state.pendingApprovals = data.pending_approvals || [];
        renderApprovals();
    } catch(e) {
        state.pendingApprovals = [];
        renderApprovals();
    }
}

function bindEvents() {
    document.getElementById('sidebar-search').addEventListener('input', debounce(renderProductList, 200));
    document.getElementById('propose-submit-btn').addEventListener('click', onSubmitPropose);
    document.getElementById('platform-filter').addEventListener('click', e => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        document.querySelectorAll('#platform-filter .chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        state.platformFilter = chip.dataset.platform || '';
        renderProductList();
    });
}

function debounce(fn, ms) {
    let timer;
    return function(...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), ms);
    };
}

// ============ Product List ============
function renderProductList() {
    const search = (document.getElementById('sidebar-search').value || '').toLowerCase();
    let filtered = state.products;
    if (state.platformFilter) {
        filtered = filtered.filter(p => (p.platform || '').toLowerCase() === state.platformFilter.toLowerCase());
    }
    if (search) {
        filtered = filtered.filter(p =>
            (p.skc||'').toLowerCase().includes(search) ||
            (p.title||'').toLowerCase().includes(search)
        );
    }
    const container = document.getElementById('product-list');
    if (!filtered.length) {
        container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted)">无匹配产品</div>';
        return;
    }
    container.innerHTML = filtered.map(p => {
        const storeStatus = p.store_status || {};
        let dots = '';
        for (const [sid, status] of Object.entries(storeStatus)) {
            const cls = status === '已上架' ? 'listed' :
                       (status === '审核中' ? 'pending' : 'none');
            dots += `<span class="store-dot ${cls}" title="${sid}: ${status}"></span>`;
        }
        return `<div class="product-item${state.selectedSku === p.skc ? ' active' : ''}" data-skc="${p.skc}" onclick="selectProduct('${p.skc}')">
            <span class="skc">${escHtml(p.skc)}</span>
            <span class="title-text">${escHtml(p.title || '无标题')}</span>
            <span class="store-dots">${dots}</span>
        </div>`;
    }).join('');
}

async function selectProduct(skc) {
    state.selectedSku = skc;
    state.selectedProduct = state.products.find(p => p.skc === skc);
    state.editField = null;
    renderProductList();
    renderDetail();
    await loadPendingApprovals();
}

// ============ Detail Panel ============
function renderDetail() {
    const panel = document.getElementById('detail-panel');
    const p = state.selectedProduct;
    if (!p) {
        panel.innerHTML = '<div class="detail-empty" id="detail-empty">选择左侧产品查看详情</div>';
        return;
    }

    const title = p.title || '无标题';
    const platform = p.platform || '未知';
    const category = p.category || '未分类';
    const pd = p.product_data || {};
    const md = p.manual_data || {};
    const ss = p.store_status || {};
    const storeRows = (state._stores && state._stores.length)
        ? state._stores.map(store => ({
            id: store.id,
            name: store.label || store.name || store.id,
            status: ss[store.id] || '未上架',
        }))
        : Object.entries(ss).map(([sid, st]) => ({ id: sid, name: sid, status: st }));

    let html = `<div class="detail-header">
        <span class="product-skc">${escHtml(p.skc)}</span>
        <span class="product-title">${escHtml(title)}</span>
        <span class="category-badge">${escHtml(category)}</span>
    </div>`;
    html += '<div class="detail-body">';

    // Basic Info
    html += `<div class="detail-section">
        <div class="detail-section-header" onclick="toggleSection(this)">
            &#128203; 基本信息
        </div>
        <div class="detail-section-body">
            ${fieldRow('SKC', p.skc, 'critical')}
            ${fieldRow('标题', title, 'critical')}
            ${fieldRow('平台', platform, 'normal')}
            ${fieldRow('品类', category, 'important')}
            ${editableFieldRow('成本价', md.cost_price || '', 'cost_price', 'important')}
        </div>
    </div>`;

    // Manual Data (Specs)
    html += `<div class="detail-section">
        <div class="detail-section-header" onclick="toggleSection(this)">
            &#128207; 规格参数
        </div>
        <div class="detail-section-body">
            ${editableFieldRow('重量 (g)', md.weight_g || '', 'weight_g', 'critical')}
            ${editableFieldRow('尺寸规格', md.size_spec || '', 'size_spec', 'critical')}
            ${editableFieldRow('规格说明', md.spec || '', 'spec', 'important')}
        </div>
    </div>`;

    // Store Status
    html += `<div class="detail-section">
        <div class="detail-section-header" onclick="toggleSection(this)">
            &#127970; 店铺状态
        </div>
        <div class="detail-section-body">
            ${storeRows.length
                ? storeRows.map(store => `
                    <div class="store-status-row">
                        <span class="store-name">${escHtml(store.name)}</span>
                        <span class="store-status s-${escHtml(store.status)}">${escHtml(store.status)}</span>
                        <a class="btn btn-sm store-listing-link" href="${listingUrl(store.id)}">${listingActionLabel(store.status)}</a>
                    </div>`).join('')
                : '<div style="color:var(--text-muted);font-size:12px;">无店铺状态记录</div>'}
        </div>
    </div>`;

    // Product Data Summary
    if (pd.product_description || pd.about_item) {
        const desc = pd.product_description || '';
        const about = pd.about_item || '';
        html += `<div class="detail-section">
            <div class="detail-section-header" onclick="toggleSection(this)">
                &#128214; 产品描述
            </div>
            <div class="detail-section-body">
                ${about ? `<div style="margin-bottom:8px;"><strong>About Item:</strong> ${escHtml(about)}</div>` : ''}
                ${desc ? `<div>${escHtml(desc)}</div>` : ''}
            </div>
        </div>`;
    }

    // Images
    if (p.images_dir || p.thumbnail) {
        html += `<div class="detail-section">
            <div class="detail-section-header" onclick="toggleSection(this)">
                &#128247; 图片集
            </div>
            <div class="detail-section-body">
                <div class="image-grid" id="image-grid">
                    <div class="loading-overlay"><span class="spinner"></span>加载图片...</div>
                </div>
            </div>
        </div>`;
    }

    // Raw data
    html += `<div class="detail-section">
        <div class="detail-section-header" onclick="toggleSection(this)">
            &#128187; 原始数据
        </div>
        <div class="detail-section-body collapsed">
            <pre style="font-size:11px;color:var(--text-muted);white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto;">${escHtml(JSON.stringify(p, null, 2))}</pre>
        </div>
    </div>`;

    html += '</div>';
    panel.innerHTML = html;

    // Update document title
    document.title = `${p.skc} - 产品维护`;

    // Load images async
    loadProductImages(p.skc);

    // Re-bind inline edit handlers
    bindInlineEdit();
}

function fieldRow(label, value, cls) {
    return `<div class="field-row">
        <span class="field-label">${escHtml(label)}</span>
        <span class="field-value">${escHtml(String(value || '—'))}</span>
        <span class="classification-badge ${cls}">${cls === 'critical' ? '&#128308;关键' : cls === 'important' ? '&#128993;重要' : '&#128994;常规'}</span>
    </div>`;
}

function editableFieldRow(label, value, fieldName, cls) {
    if (typeof value !== 'string') value = String(value || '');
    return `<div class="field-row editable" data-field="${fieldName}" data-cls="${cls}">
        <span class="field-label">${escHtml(label)}</span>
        <span class="field-value" onclick="startEdit(this, '${fieldName}', '${cls}')">${escHtml(value || '—')}</span>
        <input class="edit-input" data-field="${fieldName}" value="${escHtml(value)}">
        <span class="classification-badge ${cls}">${cls === 'critical' ? '&#128308;关键' : cls === 'important' ? '&#128993;重要' : '&#128994;常规'}</span>
        ${cls === 'critical'
            ? `<button class="btn btn-sm" style="color:var(--warning);border-color:var(--warning);" onclick="openProposeModal('${fieldName}', '${escHtml(label)}', '${escHtml(value)}')">申请变更</button>`
            : `<button class="btn btn-sm" style="display:none;" data-action="save" onclick="saveEdit('${fieldName}')">&#10003;</button>
               <button class="btn btn-sm" style="display:none;" data-action="cancel" onclick="cancelEdit('${fieldName}')">&times;</button>`}
    </div>`;
}

function bindInlineEdit() {
    document.querySelectorAll('.field-row.editable').forEach(row => {
        const fieldName = row.dataset.field;
        const cls = row.dataset.cls;
        const valueEl = row.querySelector('.field-value');
        const inputEl = row.querySelector('.edit-input');
        const saveBtn = row.querySelector('[data-action="save"]');
        const cancelBtn = row.querySelector('[data-action="cancel"]');

        if (cls !== 'critical' && valueEl) {
            valueEl.style.cursor = 'pointer';
            valueEl.addEventListener('click', () => {
                if (!state.editField || state.editField === fieldName) {
                    startEdit(valueEl, fieldName, cls);
                }
            });
        }
    });
}

function startEdit(el, fieldName, cls) {
    if (cls === 'critical') {
        openProposeModal(fieldName, el.textContent, el.textContent);
        return;
    }
    const row = el.closest('.field-row');
    if (!row) return;
    state.editField = fieldName;
    row.classList.add('editing');
    const input = row.querySelector('.edit-input');
    input.style.display = 'block';
    input.focus();
    input.select();
    row.querySelector('[data-action="save"]').style.display = 'inline-flex';
    row.querySelector('[data-action="cancel"]').style.display = 'inline-flex';

    input.addEventListener('keydown', function handler(e) {
        if (e.key === 'Enter') { saveEdit(fieldName); }
        if (e.key === 'Escape') { cancelEdit(fieldName); }
    }, { once: true });
}

async function saveEdit(fieldName) {
    const row = document.querySelector(`.field-row.editable[data-field="${fieldName}"]`);
    if (!row) return;
    const input = row.querySelector('.edit-input');
    const newValue = input.value.trim();
    const skc = state.selectedSku;

    try {
        await api(`/api/products/${skc}/manual`, 'PUT', {
            [fieldName]: newValue,
            weight_g: fieldName === 'weight_g' ? newValue : (state.selectedProduct.manual_data||{}).weight_g || '',
            size_spec: fieldName === 'size_spec' ? newValue : (state.selectedProduct.manual_data||{}).size_spec || '',
            spec: fieldName === 'spec' ? newValue : (state.selectedProduct.manual_data||{}).spec || '',
            cost_price: fieldName === 'cost_price' ? newValue : (state.selectedProduct.manual_data||{}).cost_price || '',
        });
        // Update local state
        if (!state.selectedProduct.manual_data) state.selectedProduct.manual_data = {};
        state.selectedProduct.manual_data[fieldName] = newValue;
        row.classList.remove('editing');
        row.querySelector('.field-value').textContent = newValue || '—';
        row.querySelector('[data-action="save"]').style.display = 'none';
        row.querySelector('[data-action="cancel"]').style.display = 'none';
        input.style.display = 'none';
        state.editField = null;
        toast('保存成功', 'success');
    } catch(e) {
        toast('保存失败: ' + e.message, 'error');
    }
}

function cancelEdit(fieldName) {
    const row = document.querySelector(`.field-row.editable[data-field="${fieldName}"]`);
    if (!row) return;
    const input = row.querySelector('.edit-input');
    const valueEl = row.querySelector('.field-value');
    input.value = valueEl.textContent.replace('—', '');
    row.classList.remove('editing');
    row.querySelector('[data-action="save"]').style.display = 'none';
    row.querySelector('[data-action="cancel"]').style.display = 'none';
    input.style.display = 'none';
    state.editField = null;
}

// ============ Propose Change ============
function openProposeModal(fieldName, label, currentValue) {
    state.proposeField = {
        skc: state.selectedSku,
        field_name: fieldName,
        label: label,
        current_value: currentValue,
    };
    document.getElementById('propose-field-info').textContent =
        `字段: ${label} | 当前值: ${currentValue || '(空)'}`;
    document.getElementById('propose-value').value = '';
    document.getElementById('propose-reason').value = '';
    document.getElementById('propose-modal').style.display = 'flex';
}

function closeProposeModal() {
    document.getElementById('propose-modal').style.display = 'none';
    state.proposeField = null;
}

async function onSubmitPropose() {
    const field = state.proposeField;
    if (!field) return;
    const proposedValue = document.getElementById('propose-value').value.trim();
    const reason = document.getElementById('propose-reason').value.trim();
    if (!reason) { toast('请填写变更理由', 'error'); return; }
    if (!proposedValue) { toast('请填写建议值', 'error'); return; }

    try {
        await api(`/api/products/${field.skc}/propose-change`, 'POST', {
            field: field.field_name,
            new_value: proposedValue,
            requested_by: reason
        });
        closeProposeModal();
        toast('变更申请已提交，等待审批', 'success');
        await loadPendingApprovals();
    } catch(e) {
        toast('提交失败: ' + e.message, 'error');
    }
}

// ============ Approvals ============
function renderApprovals() {
    const container = document.getElementById('approvals-list');
    const countEl = document.getElementById('approvals-count');
    const pending = state.pendingApprovals;
    countEl.textContent = `${pending.length} 项`;

    if (!pending.length) {
        container.innerHTML = '<div class="approvals-empty">暂无待审批变更</div>';
        return;
    }

    container.innerHTML = pending.map(a => `
        <div class="approval-item">
            <div class="ai-header">
                <span class="ai-field">${escHtml(a.field_name)}</span>
                <span class="ai-date">${escHtml((a.requested_at||'').slice(0,16))}</span>
            </div>
            <div class="ai-values">
                <span style="text-decoration:line-through;color:var(--text-muted)">${escHtml(String(a.old_value || '(空)'))}</span>
                &rarr;
                <span style="color:var(--accent)">${escHtml(String(a.proposed_value))}</span>
            </div>
            <div class="ai-reason">理由: ${escHtml(a.requested_by || a.reject_reason || '')}</div>
            <div class="ai-actions">
                <button class="btn btn-sm btn-success" onclick="approveChange('${a.skc}','${a.approval_id}')">&#10003; 批准</button>
                <button class="btn btn-sm btn-danger" onclick="rejectChange('${a.skc}','${a.approval_id}')">&#10007; 拒绝</button>
            </div>
        </div>
    `).join('');
}

async function approveChange(skc, approvalId) {
    try {
        await api(`/api/products/${skc}/approve/${approvalId}`, 'POST', {
            approved_by: 'admin'
        });
        toast('已批准变更', 'success');
        await loadPendingApprovals();
        // Reload product detail if viewing this product
        if (state.selectedSku === skc) {
            await loadProducts();
            state.selectedProduct = state.products.find(p => p.skc === skc);
            renderDetail();
        }
    } catch(e) {
        toast('批准失败: ' + e.message, 'error');
    }
}

async function rejectChange(skc, approvalId) {
    if (!confirm('确定拒绝此变更申请？')) return;
    try {
        await api(`/api/products/${skc}/reject/${approvalId}`, 'POST', {
            approved_by: 'admin',
            reason: '管理员驳回'
        });
        toast('已拒绝变更', 'success');
        await loadPendingApprovals();
    } catch(e) {
        toast('拒绝失败: ' + e.message, 'error');
    }
}

// ============ Images ============
async function loadProductImages(skc) {
    const grid = document.getElementById('image-grid');
    if (!grid) return;
    try {
        const data = await api(`/api/products/${skc}/images`);
        const images = data.images || [];
        if (!images.length) {
            grid.innerHTML = '<div style="color:var(--text-muted);font-size:11px;">无图片</div>';
            return;
        }
        grid.innerHTML = images.slice(0, 30).map(img =>
            `<img class="image-thumb" src="${escHtml(img.url || img)}" loading="lazy" title="${escHtml(img.name || '')}" onclick="window.open('${escHtml(img.url || img)}')" onerror="this.style.opacity='0.3'">`
        ).join('');
    } catch(e) {
        grid.innerHTML = '<div style="color:var(--text-muted);font-size:11px;">加载失败</div>';
    }
}

// ============ Section Toggle ============
function toggleSection(header) {
    const body = header.nextElementSibling;
    if (body) {
        body.classList.toggle('collapsed');
    }
}

// ============ Global Approvals Count Badge ============
async function updateApprovalsBadge() {
    // Could add a badge count to the topbar later
}

// ============ Start ============
init();
</script>
