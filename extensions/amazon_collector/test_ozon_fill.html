<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Ozon 填充自测</title>
<style>
  body { font-family: "Microsoft YaHei",sans-serif; padding:24px; background:#f0f2f5; }
  h2 { margin-top:20px; }
  .result { padding:10px; margin:6px 0; border-radius:4px; font-size:13px; }
  .pass { background:#dcfce7; color:#16a34a; }
  .fail { background:#fee2e2; color:#dc2626; }
  .info { background:#dbeafe; color:#1d4ed8; }
  pre { background:#1e1e1e; color:#d4d4d4; padding:12px; border-radius:4px; overflow-x:auto; font-size:12px; }
</style>
<style id="antd-mimic">
/* Mock Ant Design form styles */
.ant-form-item{display:flex;align-items:flex-start;margin-bottom:16px;padding:8px 12px;background:#fff;border-radius:4px;}
.ant-form-item-label{width:140px;flex-shrink:0;padding-top:6px;}
.ant-form-item-label label{font-size:13px;color:#333;}
.ant-form-item-control{flex:1;}
.ant-checkbox-wrapper,.ant-radio-wrapper{display:inline-flex;align-items:center;margin-right:12px;margin-bottom:6px;cursor:pointer;}
.ant-checkbox-wrapper input,.ant-radio-wrapper input{margin-right:4px;}
.ant-select{width:200px;padding:4px 8px;border:1px solid #d9d9d9;border-radius:4px;}
.ant-input{width:300px;padding:4px 8px;border:1px solid #d9d9d9;border-radius:4px;}
.ant-btn-primary{background:#428bca;color:#fff;border:none;padding:6px 16px;border-radius:4px;cursor:pointer;}
.hidden-section{display:none;}
</style>
</head>
<body>

<h1>🧪 sERP Ozon 填充自测</h1>
<div id="results"></div>

<!-- ===== Mock Ozon 表单 ===== -->
<div id="mock-form" style="max-width:800px;margin-top:16px;">

  <!-- 产品名称 (text) -->
  <div class="ant-form-item">
    <div class="ant-form-item-label"><label for="field-name">产品名称 (Название товара)</label></div>
    <div class="ant-form-item-control">
      <input type="text" id="field-name" class="ant-input" placeholder="输入产品名称">
    </div>
  </div>

  <!-- 价格 (text) -->
  <div class="ant-form-item">
    <div class="ant-form-item-label"><label>价格, ₽ (Цена)</label></div>
    <div class="ant-form-item-control">
      <input type="text" class="ant-input" placeholder="输入价格">
    </div>
  </div>

  <!-- 重量 (text with unit) -->
  <div class="ant-form-item">
    <div class="ant-form-item-label"><label>重量, г (Вес)</label></div>
    <div class="ant-form-item-control">
      <input type="text" class="ant-input" placeholder="输入重量">
    </div>
  </div>

  <!-- 目标受众 (radio group — 2 options) -->
  <div class="ant-form-item radio-audience">
    <div class="ant-form-item-label"><label>目标受众 (Целевая аудитория)</label></div>
    <div class="ant-form-item-control">
      <label class="ant-radio-wrapper"><input type="radio" name="audience" value="adult"> <span>成人(Взрослая)</span></label>
      <label class="ant-radio-wrapper"><input type="radio" name="audience" value="child"> <span>儿童(Детская)</span></label>
    </div>
  </div>

  <!-- 材料 (checkbox group — multi-select, 4 options) -->
  <div class="ant-form-item cb-material">
    <div class="ant-form-item-label"><label>材料 (Материал)</label></div>
    <div class="ant-form-item-control">
      <label class="ant-checkbox-wrapper"><input type="checkbox" value="leather"> <span>天然皮革 (Натуральная кожа)</span></label>
      <label class="ant-checkbox-wrapper"><input type="checkbox" value="faux"> <span>人造皮革 (Искусственная кожа)</span></label>
      <label class="ant-checkbox-wrapper"><input type="checkbox" value="fabric"> <span>织物 (Ткань)</span></label>
      <label class="ant-checkbox-wrapper"><input type="checkbox" value="metal"> <span>金属 (Металл)</span></label>
    </div>
  </div>

  <!-- 功能 (checkbox group — 6 options, 带俄语) -->
  <div class="ant-form-item cb-features">
    <div class="ant-form-item-label"><label>功能 (Функции)</label></div>
    <div class="ant-form-item-control">
      <label class="ant-checkbox-wrapper"><input type="checkbox" value="rfid"> <span>RFID保护 (RFID защита)</span></label>
      <label class="ant-checkbox-wrapper"><input type="checkbox" value="zipper"> <span>拉链 (Молния)</span></label>
      <label class="ant-checkbox-wrapper"><input type="checkbox" value="card_slots"> <span>卡槽 (Слоты для карт)</span></label>
      <label class="ant-checkbox-wrapper"><input type="checkbox" value="coin_pocket"> <span>零钱袋 (Карман для монет)</span></label>
      <label class="ant-checkbox-wrapper"><input type="checkbox" value="id_window"> <span>证件窗 (Окно для удостоверения)</span></label>
      <label class="ant-checkbox-wrapper"><input type="checkbox" value="cash_compartment"> <span>钞票隔层 (Отделение для купюр)</span></label>
    </div>
  </div>

  <!-- 颜色 (select) -->
  <div class="ant-form-item">
    <div class="ant-form-item-label"><label>颜色 (Цвет)</label></div>
    <div class="ant-form-item-control">
      <select class="ant-select">
        <option value="">请选择</option>
        <option value="red">红色 (Красный)</option>
        <option value="blue">蓝色 (Синий)</option>
        <option value="black">黑色 (Черный)</option>
        <option value="brown">棕色 (Коричневый)</option>
        <option value="beige">米色 (Бежевый)</option>
      </select>
    </div>
  </div>

  <!-- 品牌 (select with many options) -->
  <div class="ant-form-item">
    <div class="ant-form-item-label"><label>品牌 (Бренд)</label></div>
    <div class="ant-form-item-control">
      <select class="ant-select">
        <option value="">请选择品牌</option>
        <option value="fashion_look">Fashion Look</option>
        <option value="foxlover">FOXLOVER</option>
        <option value="generic">Generic</option>
        <option value="no_brand">Нет бренда (无品牌)</option>
      </select>
    </div>
  </div>

  <!-- 描述 (textarea) -->
  <div class="ant-form-item">
    <div class="ant-form-item-label"><label>产品描述 (Описание)</label></div>
    <div class="ant-form-item-control">
      <textarea class="ant-input" rows="4" placeholder="输入描述"></textarea>
    </div>
  </div>

  <!-- 积分评价 (single checkbox) -->
  <div class="ant-form-item">
    <div class="ant-form-item-label"><label>积分评价</label></div>
    <div class="ant-form-item-control">
      <label class="ant-checkbox-wrapper"><input type="checkbox" value="points"> <span>开启积分评价...</span></label>
    </div>
  </div>

  <!-- 单个开关型 checkbox (无 form-item label 上下文) -->
  <div class="ant-form-item">
    <div class="ant-form-item-label"><label>包邮</label></div>
    <div class="ant-form-item-control">
      <label class="ant-checkbox-wrapper"><input type="checkbox" value="free_ship"> <span>包邮</span></label>
    </div>
  </div>

  <!-- SKU 表格行模拟（多行同 label 字段） -->
  <div class="ant-form-item sku-row">
    <div class="ant-form-item-label"><label>价格 (Цена)</label></div>
    <div class="ant-form-item-control">
      <table>
        <tr class="ant-table-row"><td>Красный, S</td><td><input type="text" class="ant-input sku-price" placeholder="价格"></td></tr>
        <tr class="ant-table-row"><td>Синий, M</td><td><input type="text" class="ant-input sku-price" placeholder="价格"></td></tr>
        <tr class="ant-table-row"><td>Черный, L</td><td><input type="text" class="ant-input sku-price" placeholder="价格"></td></tr>
      </table>
    </div>
  </div>

</div>

<script>
// ===== Mock Chrome APIs =====
window.chrome = {
  runtime: {
    sendMessage: function(msg, callback) {
      console.log('[mock] chrome.runtime.sendMessage:', msg.type, msg.url);
      if (msg.type === 'fetch') {
        callback({ ok: true, status: 200, body: '{}' });
      } else {
        callback({});
      }
    },
    lastError: null
  },
  storage: {
    local: {
      _data: {},
      get: function(keys, callback) {
        var result = {};
        if (Array.isArray(keys)) {
          keys.forEach(function(k) { if (this._data[k] !== undefined) result[k] = this._data[k]; }, this);
        } else {
          result = Object.assign({}, this._data);
        }
        console.log('[mock] chrome.storage.local.get:', keys, '→', Object.keys(result).length, 'keys');
        callback(result);
      },
      set: function(kv, callback) {
        Object.assign(this._data, kv);
        console.log('[mock] chrome.storage.local.set:', Object.keys(kv));
        if (callback) callback();
      }
    }
  }
};
</script>

<!-- Extension code injected by Puppeteer via evaluateOnNewDocument -->

<script>
// ===== Test Runner =====
var results = document.getElementById('results');
var passCount = 0;
var failCount = 0;

function assert(desc, condition, detail) {
  var cls = condition ? 'pass' : 'fail';
  if (condition) passCount++; else failCount++;
  var html = '<div class="result ' + cls + '">' + (condition ? '✅' : '❌') + ' ' + desc;
  if (detail !== undefined && !condition) html += ' — <code>' + JSON.stringify(detail) + '</code>';
  html += '</div>';
  results.innerHTML += html;
}

function section(title) {
  results.innerHTML += '<h2>' + title + '</h2>';
}

// Tests triggered from Puppeteer after code injection

function runTests() {
  // ====== 测试 1: buildSelector() ======
  section('测试 1: buildSelector() — 选择器可靠性');

  var elId = document.getElementById('field-name');
  var selId = buildSelector(elId);
  assert('有 id 的元素使用 #id 选择器', selId === '#field-name', selId);
  assert('选择器能找回原元素', document.querySelector(selId) === elId);

  var radio = document.querySelector('.radio-audience input[type="radio"]');
  var selRadio = buildSelector(radio);
  var foundRadio = document.querySelector(selRadio);
  assert('radio 选择器以 data-serp-fid 开头', selRadio.indexOf('[data-serp-fid="') === 0, selRadio);
  assert('data-serp-fid 选择器能找回 radio', foundRadio === radio, 'found: ' + (foundRadio ? foundRadio.tagName : 'null'));

  var cb = document.querySelector('.cb-material input[type="checkbox"]');
  var selCb = buildSelector(cb);
  var foundCb = document.querySelector(selCb);
  assert('checkbox 选择器以 data-serp-fid 开头', selCb.indexOf('[data-serp-fid="') === 0, selCb);
  assert('data-serp-fid 选择器能找回 checkbox', foundCb === cb);

  var selEl = document.querySelector('.ant-select');
  var selSel = buildSelector(selEl);
  assert('select 选择器非空', selSel.length > 0, selSel);

  // ====== 测试 2: findLabel() ======
  section('测试 2: findLabel() — 标签识别');

  var nameLabel = findLabel(elId);
  assert('找到 text input 的标签', nameLabel.indexOf('产品名称') !== -1, nameLabel);

  var radioGroupLabel = findLabel(radio, true);  // form-item label
  assert('找到 radio 组的 form-item 标签', radioGroupLabel.indexOf('目标受众') !== -1, radioGroupLabel);

  var radioOptLabel = findLabel(radio);  // individual radio label
  assert('找到 radio 的选项标签', radioOptLabel.indexOf('成人') !== -1 || radioOptLabel.indexOf('Взрослая') !== -1, radioOptLabel);

  var cbGroupLabel = findLabel(cb, true);
  assert('找到 checkbox 组的 form-item 标签', cbGroupLabel.indexOf('材料') !== -1 || cbGroupLabel.indexOf('Материал') !== -1, cbGroupLabel);

  var cbOptLabel = findLabel(cb);
  assert('找到 checkbox 的选项标签', cbOptLabel.length > 0, cbOptLabel);

  // ====== 测试 3: collectFormFields() ======
  section('测试 3: collectFormFields() — 字段收集');

  var fields = collectFormFields();

  // 分类统计
  var txtFields = fields.filter(function(f) { return f.tag === 'input' && f.type !== 'checkbox' && f.type !== 'radio'; });
  var selFields = fields.filter(function(f) { return f.tag === 'select'; });
  var cbGroups = fields.filter(function(f) { return f.tag === 'checkbox-group'; });
  var rdGroups = fields.filter(function(f) { return f.tag === 'radio-group'; });
  var singleCb = fields.filter(function(f) { return f.tag === 'input' && f.type === 'checkbox'; });
  var singleRd = fields.filter(function(f) { return f.tag === 'input' && f.type === 'radio'; });
  var taFields = fields.filter(function(f) { return f.tag === 'textarea'; });

  results.innerHTML += '<div class="result info">📊 字段统计: ' + txtFields.length + ' 文本, ' + selFields.length + ' 下拉, ' + cbGroups.length + ' 多选组, ' + rdGroups.length + ' 单选组, ' + singleCb.length + ' 独立checkbox, ' + singleRd.length + ' 独立radio, ' + taFields.length + ' 文本域 — 共 ' + fields.length + ' 个</div>';

  assert('收集到文本输入字段', txtFields.length >= 4, txtFields.length);
  assert('收集到下拉字段', selFields.length >= 2, selFields.length);
  assert('收集到多选组', cbGroups.length >= 1, cbGroups.length);
  assert('收集到单选组', rdGroups.length >= 1, rdGroups.length);
  assert('收集到文本域', taFields.length >= 1, taFields.length);

  // 测试 3a: checkbox 组不应丢选项
  var materialGroup = cbGroups.find(function(g) { return g.label.indexOf('材料') !== -1; });
  if (materialGroup) {
    assert('材料组包含 4 个选项', materialGroup.options.length === 4, materialGroup.options.length);
    assert('材料组有 4 个 selectors', materialGroup.selectors.length === 4, materialGroup.selectors.length);
    var optTexts = materialGroup.options.map(function(o) { return o.text; });
    assert('选项包含"天然皮革"', optTexts.some(function(t) { return t.indexOf('天然皮革') !== -1; }));
    assert('选项包含"人造皮革"', optTexts.some(function(t) { return t.indexOf('人造皮革') !== -1; }));
    assert('选项包含"织物"', optTexts.some(function(t) { return t.indexOf('织物') !== -1; }));
    assert('选项包含"金属"', optTexts.some(function(t) { return t.indexOf('金属') !== -1; }));
  } else {
    assert('找到材料组', false, 'materialGroup not found in cbGroups');
  }

  // 测试 3b: radio 组应有 2 个选项
  var audienceGroup = rdGroups.find(function(g) { return g.label.indexOf('目标受众') !== -1; });
  if (audienceGroup) {
    assert('目标受众组包含 2 个选项', audienceGroup.options.length === 2, audienceGroup.options.length);
    var rdOptTexts = audienceGroup.options.map(function(o) { return o.text; });
    assert('选项包含"成人"', rdOptTexts.some(function(t) { return t.indexOf('成人') !== -1 || t.indexOf('Взрослая') !== -1; }));
    assert('选项包含"儿童"', rdOptTexts.some(function(t) { return t.indexOf('儿童') !== -1 || t.indexOf('Детская') !== -1; }));
  } else {
    assert('找到目标受众组', false, 'audienceGroup not found in rdGroups');
  }

  // 测试 3c: 单个 checkbox 不应误判为组
  assert('独立 checkbox 不是组', singleCb.length >= 1, '独立checkbox: ' + singleCb.length);

  // 测试 3d: 不应有空标签的垃圾字段
  var emptyLabelFields = fields.filter(function(f) {
    return !f.label || f.label.trim() === '' || f.label.indexOf('(可选值:)') === 0 || f.label.indexOf('(选项:)') === 0;
  });
  assert('没有空标签或垃圾字段', emptyLabelFields.length === 0, emptyLabelFields.length + ' 个垃圾: ' + JSON.stringify(emptyLabelFields.map(function(f) { return f.label; })));

  // 测试 3e: 所有 selector 都能找回元素
  var brokenSelectors = [];
  fields.forEach(function(f) {
    var el = document.querySelector(f.selector);
    if (!el) {
      brokenSelectors.push({ label: f.label, selector: f.selector });
    }
  });
  assert('所有字段的 selector 都能在 DOM 中找到元素', brokenSelectors.length === 0, brokenSelectors.length + ' 个失效: ' + JSON.stringify(brokenSelectors.slice(0, 5)));

  // ====== 测试 4: fillFormField() ======
  section('测试 4: fillFormField() — 填充执行');

  // 构建 fieldMeta（模拟 doAutoFill 中的元数据）
  var fieldMeta = {};
  fields.forEach(function(f, idx) {
    fieldMeta[f.selector] = {
      label: f.label || f.name || f.selector,
      order: idx,
      selectors: f.selectors || null,
      options: f.options || null,
      tag: f.tag || null
    };
  });

  // 4a: 填充文本字段
  var nameField = txtFields.find(function(f) { return f.label.indexOf('产品名称') !== -1; });
  if (nameField) {
    var meta = fieldMeta[nameField.selector];
    var ok = fillFormField(nameField.selector, 'Тестовый кошелек', meta);
    assert('文本字段填充成功', ok === true);
    assert('文本字段值正确', document.querySelector(nameField.selector).value === 'Тестовый кошелек');
  }

  // 4b: 填充价格
  var priceField = txtFields.find(function(f) { return f.label.indexOf('价格') !== -1 && f.label.indexOf('₽') !== -1; });
  if (priceField) {
    fillFormField(priceField.selector, '2500', fieldMeta[priceField.selector]);
    assert('价格填充成功', document.querySelector(priceField.selector).value === '2500');
  }

  // 4c: 填充 select
  var colorField = selFields.find(function(f) { return f.label.indexOf('颜色') !== -1; });
  if (colorField) {
    var colorMeta = fieldMeta[colorField.selector];
    var okColor = fillFormField(colorField.selector, '红色 (Красный)', colorMeta);
    var selEl = document.querySelector(colorField.selector);
    assert('颜色下拉填充成功', okColor === true);
    assert('颜色下拉值为 red', selEl.value === 'red', 'value=' + selEl.value);
  }

  // 4d: 填充 radio 组
  if (audienceGroup) {
    var rdMeta = fieldMeta[audienceGroup.selector];
    var okRd = fillFormField(audienceGroup.selector, '成人(Взрослая)', rdMeta);
    var adultRadio = document.querySelector('.radio-audience input[value="adult"]');
    var childRadio = document.querySelector('.radio-audience input[value="child"]');
    assert('radio 组填充成功', okRd === true);
    assert('成人 radio 被选中', adultRadio.checked === true);
    assert('儿童 radio 未被选中', childRadio.checked === false);
  }

  // 4e: 填充 checkbox 组 — 单值
  if (materialGroup) {
    var cbMeta = fieldMeta[materialGroup.selector];
    // 重置
    materialGroup.selectors.forEach(function(s) {
      var el = document.querySelector(s);
      if (el) el.checked = false;
    });
    var okCb = fillFormField(materialGroup.selector, '天然皮革', cbMeta);
    assert('checkbox 组单值填充成功', okCb === true);

    // 验证哪个被勾选了
    var leatherCb = materialGroup.options.find(function(o) { return o.text.indexOf('天然皮革') !== -1; });
    var fauxCb = materialGroup.options.find(function(o) { return o.text.indexOf('人造皮革') !== -1; });
    assert('天然皮革被勾选', leatherCb && document.querySelector(leatherCb.selector).checked === true);
    assert('人造皮革未被勾选', fauxCb && document.querySelector(fauxCb.selector).checked === false);
  }

  // 4f: 填充 checkbox 组 — 多值（逗号分隔）
  if (materialGroup) {
    var cbMeta2 = fieldMeta[materialGroup.selector];
    materialGroup.selectors.forEach(function(s) {
      var el = document.querySelector(s);
      if (el) el.checked = false;
    });
    var okCb2 = fillFormField(materialGroup.selector, '天然皮革, 织物', cbMeta2);
    assert('checkbox 组多值填充成功', okCb2 === true);

    var leatherCb = materialGroup.options.find(function(o) { return o.text.indexOf('天然皮革') !== -1; });
    var fabricCb = materialGroup.options.find(function(o) { return o.text.indexOf('织物') !== -1; });
    var fauxCb = materialGroup.options.find(function(o) { return o.text.indexOf('人造皮革') !== -1; });
    assert('天然皮革被勾选', leatherCb && document.querySelector(leatherCb.selector).checked === true);
    assert('织物被勾选', fabricCb && document.querySelector(fabricCb.selector).checked === true);
    assert('人造皮革未被勾选', fauxCb && document.querySelector(fauxCb.selector).checked === false);
  }

  // 4g: 填充 select — 模糊匹配
  var brandField = selFields.find(function(f) { return f.label.indexOf('品牌') !== -1; });
  if (brandField) {
    var brandMeta = fieldMeta[brandField.selector];
    // 先重置
    document.querySelector(brandField.selector).value = '';
    var okBrand = fillFormField(brandField.selector, 'foxlover', brandMeta);  // 模糊匹配
    assert('品牌模糊匹配成功', okBrand === true);
    assert('品牌值为 foxlover', document.querySelector(brandField.selector).value === 'foxlover', document.querySelector(brandField.selector).value);
  }

  // 4h: 填充布尔 checkbox（单个）
  var freeShipCb = singleCb.find(function(f) { return f.label.indexOf('包邮') !== -1; });
  if (freeShipCb) {
    var shipMeta = fieldMeta[freeShipCb.selector];
    var okShip = fillFormField(freeShipCb.selector, 'true', shipMeta);
    assert('单个 checkbox true 填充成功', okShip === true);
    assert('包邮 checkbox 被勾选', document.querySelector(freeShipCb.selector).checked === true);
  }

  // 4i: 填充 textarea
  var descField = taFields.find(function(f) { return f.label.indexOf('描述') !== -1; });
  if (descField) {
    fillFormField(descField.selector, 'Тестовое описание товара', fieldMeta[descField.selector]);
    assert('文本域填充成功', document.querySelector(descField.selector).value === 'Тестовое описание товара');
  }

  // ====== 测试 5: SKU 行上下文 ======
  section('测试 5: SKU 行上下文 — 多行同名字段');

  var skuFields = txtFields.filter(function(f) { return f.label.indexOf('Красный') !== -1 || f.label.indexOf('Синий') !== -1 || f.label.indexOf('Черный') !== -1; });
  assert('SKU 行上下文字段被收集', skuFields.length >= 3, skuFields.length + ' 个SKU字段');

  // ====== 结果汇总 ======
  section('📊 结果汇总');
  results.innerHTML += '<div class="result ' + (failCount === 0 ? 'pass' : 'fail') + '" style="font-size:16px;font-weight:bold;">';
  results.innerHTML += '通过 ' + passCount + ' / 失败 ' + failCount + ' (' + Math.round(passCount / (passCount+failCount) * 100) + '%)';
  results.innerHTML += '</div>';

  if (failCount === 0) {
    results.innerHTML += '<div class="result pass">🎉 所有测试通过！</div>';
  }

  console.log('测试完成: ' + passCount + ' 通过, ' + failCount + ' 失败');
}
</script>
</body>
</html>
